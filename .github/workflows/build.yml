name: Build BLOODYITEMS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded source ZIP
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'BLOODYITEMS-GitHub-Actions-Ready.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Source ZIP not found in repository root."
            echo "Upload BLOODYITEMS-GitHub-Actions-Ready.zip or extract its contents into the repository."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/BLOODYITEMS/build.gradle

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build plugin
        working-directory: extracted/BLOODYITEMS
        run: gradle clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: BLOODYITEMS-1.0.0
          path: extracted/BLOODYITEMS/build/libs/BLOODYITEMS-1.0.0.jar
          if-no-files-found: error
