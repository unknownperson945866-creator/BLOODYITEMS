name: Build BLOODYITEMS
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: gradle clean build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BLOODYITEMS-2.0.0
          path: build/libs/BLOODYITEMS-2.0.0.jar
          if-no-files-found: error
